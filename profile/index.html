                <button type="button" class="theme-option-pill" data-theme-val="system">System</button>

  <main class="section profile-main-section">
    <div class="container profile-container">
      <!-- Profile Header / User Badge Card -->
      <div class="card profile-header-card">
        <div class="profile-avatar-container">
          <div class="profile-avatar-ring">
            <div class="profile-avatar-wrapper" id="user-avatar-wrapper">
              <span id="user-avatar">U</span>
              <img id="user-photo" src="" alt="Profile Photo" style="display: none;">
            </div>
          </div>
        </div>

        <h1 class="card-title profile-user-title" id="user-name">Loading...</h1>
        <p class="card-desc profile-user-email" id="user-email">loading...</p>
      </div>

      <!-- Account Section -->
      <div class="card profile-section-card">
        <div class="profile-section-header">
          <div class="profile-section-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <h2>Account</h2>
        </div>

        <form id="edit-profile-form" class="profile-account-form">
          <div class="form-group">
            <label for="edit-name-input" class="form-label">Display Name</label>
            <div class="input-action-row">
              <input type="text" id="edit-name-input" class="form-control" placeholder="Enter full name" required>
              <button type="submit" class="btn btn-primary btn-sm" id="save-name-btn">Save</button>
            </div>
          </div>
          <div id="profile-msg" style="display: none;"></div>
        </form>

        <div class="profile-logout-row">
          <div class="logout-text-info">
            <div class="logout-title">Log Out of Account</div>
            <div class="logout-subtext">Sign out on this device</div>
          </div>
          <button type="button" class="btn btn-outline-danger btn-sm logout-btn" id="logout-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
          </button>
        </div>
      </div>

      <!-- Preferences Section -->
      <div class="card profile-section-card">
        <div class="profile-section-header">
          <div class="profile-section-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </div>
          <h2>Preferences</h2>
        </div>

        <!-- Appearance Theme -->
        <div class="pref-group">
          <label class="form-label">Appearance Theme</label>
          <div class="segmented-control pref-theme-selector">
            <button type="button" class="segmented-btn pref-theme-btn" data-theme-val="light">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span>Light</span>
            </button>
            <button type="button" class="segmented-btn pref-theme-btn" data-theme-val="dark">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>Dark</span>
            </button>
            <button type="button" class="segmented-btn pref-theme-btn" data-theme-val="system">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>System</span>
            </button>
          </div>
        </div>

        <!-- Language -->
        <div class="pref-group">
          <label class="form-label">Language</label>
          <div class="segmented-control">
            <button type="button" class="segmented-btn active" disabled>
              <span>English (US)</span>
            </button>
            <button type="button" class="segmented-btn disabled-btn" disabled>
              <span>Bangla</span>
              <span class="badge-soon">Soon</span>
            </button>
          </div>
        </div>
      </div>

      <!-- More Section -->
      <div class="card profile-section-card">
        <div class="profile-section-header">
          <div class="profile-section-icon-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </div>
          <h2>More Information</h2>
        </div>

        <div class="profile-menu-group">
          <a href="../about/index.html" class="profile-menu-link">

              <span>About Us</span>
            </div>
            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

          <a href="../contact/index.html" class="profile-menu-link">
            <div class="menu-link-label">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <span>Contact Support</span>
            </div>
            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </a>

          <a href="../privacy-policy/index.html" class="profile-menu-link">
            <div class="menu-link-label">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>

            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>

          <a href="../terms-of-service/index.html" class="profile-menu-link">
            <div class="menu-link-label">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>

      </div>
